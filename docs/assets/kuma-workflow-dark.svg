<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc">
<title id="title">KUMA workflow</title>
<desc id="desc">Generate a Case from an Agent Profile, strategy and difficulty. For each Input, run your own Agent while KUMA captures available evidence, then submit output plus evidence. Continue with the next Input while more remain. After all Inputs complete, Judge evaluates the full run against a private Rubric and produces a report. Observe-only mode captures instrumented traces from an existing task into a local timeline without a Case or Judge. Illustrations are schematic, not product screenshots.</desc>
