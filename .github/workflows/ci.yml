name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Ordinary CI commands must not contact the release API.
  KUMA_DISABLE_UPDATE_CHECK: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check --exclude "*.ipynb" .
      - run: python -m ruff format --check --exclude "*.ipynb" .
      - run: python tools/verify_public_api_docs.py
      - run: python tools/verify_agent_profile_migration.py
      - run: python tools/verify_evidence_capacity.py
      - run: python tools/verify_cli_atomic_output.py
      - run: python tools/verify_transport_failures.py
      - run: python tools/verify_judge_busy.py
      - run: python tools/verify_operation_poll_backoff.py
      - run: python tools/verify_auth_retry_after.py
      - run: python tools/verify_privacy_authorization.py
      - run: python tools/verify_trajectory.py
      - run: python tools/verify_capture.py
      - run: python tools/verify_capture_boundaries.py
      - run: python tools/verify_safe_diagnostics.py
      - run: python tools/verify_release_038.py
      - run: python -m compileall -q src examples tools

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -c "import importlib.metadata, kuma; assert kuma.__version__ == importlib.metadata.version('kuma-defuzex')"
      - run: python -m kuma --help
      - run: python examples/minimal_local.py
      - run: python tools/verify_minimal_local.py
      - run: python tools/verify_single_agent_template.py
      - run: python tools/verify_agent_integration_demo.py
      - run: python tools/verify_evidence_capacity.py
      - run: python tools/verify_executed_strategy_group.py
      - run: python tools/verify_cli_atomic_output.py
      - run: python tools/verify_transport_failures.py
      - run: python tools/verify_judge_busy.py
      - run: python tools/verify_operation_poll_backoff.py
      - run: python tools/verify_auth_retry_after.py
      - run: python tools/verify_privacy_authorization.py
      - run: python tools/verify_trajectory.py
      - run: python tools/verify_capture.py
      - run: python tools/verify_capture_boundaries.py
      - run: python tools/verify_safe_diagnostics.py

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -c "import importlib.metadata, kuma; assert kuma.__version__ == importlib.metadata.version('kuma-defuzex')"
      - run: python -m kuma --help
      - run: python examples/minimal_local.py
      - run: python tools/verify_minimal_local.py
      - run: python tools/verify_single_agent_template.py
      - run: python tools/verify_agent_integration_demo.py
      - run: python tools/verify_evidence_capacity.py
      - run: python tools/verify_executed_strategy_group.py
      - run: python tools/verify_cli_atomic_output.py
      - run: python tools/verify_transport_failures.py
      - run: python tools/verify_judge_busy.py
      - run: python tools/verify_operation_poll_backoff.py
      - run: python tools/verify_privacy_authorization.py
      - run: python tools/verify_trajectory.py
      - run: python tools/verify_capture.py
      - run: python tools/verify_capture_boundaries.py

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -c "import importlib.metadata, kuma; assert kuma.__version__ == importlib.metadata.version('kuma-defuzex')"
      - run: python -m kuma --help
      - run: python examples/minimal_local.py
      - run: python tools/verify_minimal_local.py
      - run: python tools/verify_single_agent_template.py
      - run: python tools/verify_agent_integration_demo.py
      - run: python tools/verify_evidence_capacity.py
      - run: python tools/verify_executed_strategy_group.py
      - run: python tools/verify_cli_atomic_output.py
      - run: python tools/verify_transport_failures.py
      - run: python tools/verify_judge_busy.py
      - run: python tools/verify_operation_poll_backoff.py
      - run: python tools/verify_privacy_authorization.py
      - run: python tools/verify_trajectory.py
      - run: python tools/verify_capture.py
      - run: python tools/verify_capture_boundaries.py

  otel-compatibility:
    name: OTel ${{ matrix.otel-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otel-version: ["1.30.0", "1.38.0", "1.39.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install -e .
          "opentelemetry-api==${{ matrix.otel-version }}"
          "opentelemetry-sdk==${{ matrix.otel-version }}"
      - run: python tools/verify_otel_compat.py

  java:
    name: Java OTLP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: examples/java_agent/pom.xml
      - run: python -m pip install ".[otlp]"
      - run: python -W error::ResourceWarning -m unittest discover -s tests -p test_otlp_receiver.py
      - run: mvn -B -q -f examples/java_agent/pom.xml package dependency:build-classpath "-Dmdep.outputFile=target/classpath.txt"
      - run: python tools/verify_java_agent.py

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install and verify wheel
        run: |
          python -m venv /tmp/kuma-wheel
          /tmp/kuma-wheel/bin/python -m pip install dist/*.whl
          /tmp/kuma-wheel/bin/python -c "import importlib.metadata, kuma; assert kuma.__version__ == importlib.metadata.version('kuma-defuzex')"
      - name: Install and verify sdist
        run: |
          python -m venv /tmp/kuma-sdist
          /tmp/kuma-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/kuma-sdist/bin/python -c "import importlib.metadata, kuma; assert kuma.__version__ == importlib.metadata.version('kuma-defuzex')"

  docker-smoke:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f examples/full_stack/Dockerfile.user-flow -t kuma-user-flow .

  capture-integrations:
    name: Capture integrations
    runs-on: ubuntu-latest
    env:
      KUMA_RUN_INSTRUMENTATION_TESTS: "1"
      KUMA_DISABLE_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install . -r examples/requirements-instrumentation.txt "coverage>=7.10,<8"
      - run: coverage run --branch --source=kuma.capture,kuma.capture_store,kuma.capture_instrumentation,kuma.capture_cli tools/verify_capture_boundaries.py
      - run: coverage run --append --branch --source=kuma.capture,kuma.capture_store,kuma.capture_instrumentation,kuma.capture_cli tools/verify_capture.py
      - run: coverage report --fail-under=100
