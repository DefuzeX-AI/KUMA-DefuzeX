[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kuma-defuzex"
dynamic = ["version"]
description = "Authenticated KUMA Python SDK for Agent behavior testing services."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "KUMA by DefuzeX" }]
keywords = ["agent", "security", "behavior-testing", "evaluation", "llm-judge"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "jsonschema>=4.23,<5",
    "PyYAML>=6.0.2,<7",
]

[project.urls]
Homepage = "https://github.com/DefuzeX-AI/KUMA-DefuzeX"
Repository = "https://github.com/DefuzeX-AI/KUMA-DefuzeX"

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
]
dev = [
    "build>=1.2,<2",
    "ruff>=0.15,<0.16",
    "twine>=6,<8",
]

[project.scripts]
kuma = "kuma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kuma = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "kuma._version.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
    "C90",
    "PLR0912",
    "PLR0915",
]
